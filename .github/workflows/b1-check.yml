name: OTTO B1 Preview Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b1-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Verify all B1 source tasks
        run: npm run test:b1
      - name: Build isolated OTTO B1
        run: npm run build
      - name: Install Playwright for real browser smoke
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Verify exam, grading, draft persistence, voice and mobile
        run: node tests/b1-preview-browser.mjs
      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: otto-b1-preview-dist
          path: dist/
          retention-days: 5

  audio-coverage:
    name: Validate 599 published B1 audio files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check complete audio manifest and pack integrity
        run: node --test tests/b1-audio.test.mjs
