# Manual, owner-approved transfer. Add ONLY this workflow to main with [skip netlify].
# Never runs on push, never deploys the application or edits student data.
name: OTTO30 Approved Production Blobs Transfer

on:
  workflow_dispatch:
    inputs:
      confirm_copy:
        description: 'Copy 500 verified materials and 30 private keys to Production Blobs?'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: otto30-approved-production-blobs
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.repository == 'chistocrym-wq/otto-a1' && github.ref == 'refs/heads/main' && inputs.confirm_copy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: otto-netlify-audit
      deployment: false
    steps:
      - name: Checkout main (isolated dependencies only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout immutable approved Preview 13 code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d5b728e698340e2e782935f21231a4894c31115d
          path: .otto-audit-deps/pinned
          persist-credentials: false
      - name: Verify pinned source and locked isolated dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .otto-audit-deps/pinned rev-parse HEAD)" = 'd5b728e698340e2e782935f21231a4894c31115d'
          test "$(git hash-object .otto-audit-deps/pinned/scripts/otto30-production-transfer.mjs)" = 'f3b68f349ea6d6e7cdca88e5ea64e3b42cc43b1c'
          test "$(git hash-object .otto-audit-deps/pinned/netlify/lib/otto30-private.js)" = 'bd16f5c76f9be87ff8b63aec8227dcc60cdf5a7f'
          test "$(git hash-object .otto-audit-deps/pinned/netlify/lib/otto30-key-fingerprints.js)" = 'c917c56134e349b87bd81193e0f08788b5eacbeb'
          test "$(git hash-object .otto-audit-deps/package.json)" = '43096a7c37bdce7aee25c412ca960e730c3842b2'
          test "$(git hash-object .otto-audit-deps/package-lock.json)" = 'd61e87ddca25937cc2ddcc76921dbbe16c5b8be7'
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated dependencies and run transfer safety tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix .otto-audit-deps --ignore-scripts --no-audit --no-fund
          node --check .otto-audit-deps/pinned/scripts/otto30-production-transfer.mjs
          node --test .otto-audit-deps/pinned/tests/otto30-production-transfer.test.mjs
          node --test .otto-audit-deps/pinned/tests/otto31-owner-release.test.mjs
      - name: Read-only site check, complete preflight, approved copy, complete postflight
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          OTTO30_TRANSFER_TARGET_SITE_ID: '6cd5980e-1876-40f3-85e4-b227362b4d3d'
          TRANSFER_REPORT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${NETLIFY_AUTH_TOKEN:-}"
          node --input-type=module <<'JS'
          import {strict as assert} from 'node:assert';
          import {writeFileSync} from 'node:fs';
          const id='6cd5980e-1876-40f3-85e4-b227362b4d3d';
          const res=await fetch('https://api.netlify.com/api/v1/sites/'+id,{
            headers:{Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN,Accept:'application/json'},
            signal:AbortSignal.timeout(20000)
          });
          assert.equal(res.status,200,'Netlify site metadata unavailable');
          const site=await res.json();
          assert.equal(site.id,id);
          const hosts=[site.url,site.ssl_url,'https://'+site.name+'.netlify.app']
            .filter(x=>typeof x==='string').flatMap(x=>{try{return [new URL(x).hostname]}catch{return []}});
          assert.ok(hosts.includes('otto-a1.netlify.app'),'wrong Netlify site');
          const published=site.published_deploy?.id||site.published_deploy_id;
          assert.ok(typeof published==='string'&&published.length>8,'Published Deploy ID missing');
          writeFileSync(process.env.TRANSFER_REPORT_DIR+'/otto30-deploy-before.json',JSON.stringify({id,published}),{mode:0o600});
          console.log('Target Production Site ID confirmed:',id,'; published Deploy ID:',published);
          JS
          node .otto-audit-deps/pinned/scripts/otto30-production-transfer.mjs | tee "$TRANSFER_REPORT_DIR/otto30-preflight.json"
          node --input-type=module <<'JS'
          import {strict as assert} from 'node:assert';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.TRANSFER_REPORT_DIR+'/otto30-preflight.json','utf8'));
          assert.equal(r.mode,'READ_ONLY');
          assert.equal(r.sourceChecked,530);
          assert.equal(r.targetObjectsChecked,531);
          assert.equal(r.identical+r.missing,531);
          assert.equal(r.productionWrites,0);
          assert.equal(r.attemptsTouched,0);
          assert.equal(r.target.siteID,'6cd5980e-1876-40f3-85e4-b227362b4d3d');
          assert.equal(r.target.host,'otto-a1.netlify.app');
          JS
          OTTO30_TRANSFER_WRITE_APPROVED=I_AUTHORIZE_530_PRIVATE_OBJECTS \
          OTTO30_TRANSFER_TARGET_ID_CONFIRMED=6cd5980e-1876-40f3-85e4-b227362b4d3d \
          OTTO30_TRANSFER_TARGET_HOST_CONFIRMED=otto-a1.netlify.app \
            node .otto-audit-deps/pinned/scripts/otto30-production-transfer.mjs --apply-production | tee "$TRANSFER_REPORT_DIR/otto30-copy.json"
          node --input-type=module <<'JS'
          import {strict as assert} from 'node:assert';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.TRANSFER_REPORT_DIR+'/otto30-copy.json','utf8'));
          assert.equal(r.mode,'EXPLICIT_WRITE');
          assert.equal(r.created+r.resumed,531);
          assert.equal(r.readbackVerified,531);
          assert.equal(r.protectedPrivateKeys,30);
          assert.equal(r.readyMarkerVerified,true);
          assert.equal(r.attemptsTouched,0);
          assert.equal(r.productionPublished,false);
          JS
          node .otto-audit-deps/pinned/scripts/otto30-production-transfer.mjs | tee "$TRANSFER_REPORT_DIR/otto30-postflight.json"
          node --input-type=module <<'JS'
          import {strict as assert} from 'node:assert';
          import {readFileSync,writeFileSync} from 'node:fs';
          const dir=process.env.TRANSFER_REPORT_DIR;
          const r=JSON.parse(readFileSync(dir+'/otto30-postflight.json','utf8'));
          assert.equal(r.mode,'READ_ONLY');
          assert.equal(r.sourceChecked,530);
          assert.equal(r.targetObjectsChecked,531);
          assert.equal(r.identical,531);
          assert.equal(r.missing,0);
          assert.equal(r.readyMarkerVerified,true);
          assert.equal(r.productionWrites,0);
          const before=JSON.parse(readFileSync(dir+'/otto30-deploy-before.json','utf8'));
          const response=await fetch('https://api.netlify.com/api/v1/sites/'+before.id,{
            headers:{Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN,Accept:'application/json'},
            signal:AbortSignal.timeout(20000)
          });
          assert.equal(response.status,200);
          const site=await response.json();
          assert.equal(site.published_deploy?.id||site.published_deploy_id,before.published);
          const report={result:'PASS',productionSiteID:before.id,publishedDeployID:before.published,
            materialsVerified:500,privateKeysVerified:30,sha256:'PASS',readyMarker:'PASS',
            publishedDeployUnchanged:true,studentDataTouched:false,productionAppPublished:false};
          writeFileSync(dir+'/otto30-copy-summary.json',JSON.stringify(report,null,2)+'\n',{mode:0o600});
          console.log(JSON.stringify(report));
          JS
      - name: Upload sanitized receipt (no student data or private key contents)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: otto30-production-transfer-summary
          path: ${{ runner.temp }}/otto30-copy-summary.json
          if-no-files-found: error
          retention-days: 1
