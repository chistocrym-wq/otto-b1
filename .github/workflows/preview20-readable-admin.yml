name: Preview20 readable admin
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: preview20-readable-admin-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.event.pull_request.number == 20 && github.head_ref == 'preview/admin-journey-analytics-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Base package-lock lacks pdfkit and transitive dependencies; match existing CI.
      # No changes to repository dependency manifests for the admin UI task.
      - run: npm install --no-audit --no-fund
      - name: Readable evidence unit tests
        run: node --test tests/readable-admin.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Install CI-only browser runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Synthetic read-only browser checks
        run: node tests/readable-admin-browser.mjs
      - name: Restored messaging UI - all API traffic mocked
        run: node tests/admin-telegram-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview20-readable-admin-${{ github.event.pull_request.head.sha }}
          path: artifacts/readable-admin/
          retention-days: 3
